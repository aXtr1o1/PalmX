name: Deploy PalmX 

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: gitOps
        run: |
          cd /var/app/PalmX
          
          git fetch
          git reset --hard HEAD
      - name: Backend Service Init
        run: |
          cd /var/app/PalmX
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      
      - name: Fronten Service Init
        run: |
          cd /var/app/PalmX/app/frontend/
          rm -rf node_modules .next package-lock.json
          npm install
          npm install autoprefixer postcss tailwindcss --save-dev
          npm run build
          cp -r public .next/standalone
          cp -r .next/static .next/standalone/.next/
        
      - name: Restart Backend Service
        run: |
          sudo systemctl restart palmx-backend
          sudo systemctl restart palmx-frontend
        
